# Nginx 反向代理配置（HTTP 版，无域名）
# 注意：微信小程序正式版必须 HTTPS + 已备案域名
# 开发调试期可在微信开发者工具勾选"不校验合法域名"

server {
    listen 80 default_server;
    server_name _;

    # 图片上传限制（与前端 5MB 校验对应，留余量）
    client_max_body_size 10M;

    # AI 识别接口较慢，延长超时
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API 接口
    location /api/ {
        proxy_pass http://herb-api:8080;
    }

    # 内置静态资源（药材图片、鉴别图片等，随镜像分发）
    location /static/ {
        proxy_pass http://herb-api:8080;
    }

    # 用户上传图片（反馈图片等，挂载持久卷）
    location /uploads/ {
        proxy_pass http://herb-api:8080;
    }

    # 前端静态页面（demo.html 等，由 Express 提供）
    location / {
        proxy_pass http://herb-api:8080;
    }

    # 健康检查直通
    location = /api/health {
        proxy_pass http://herb-api:8080;
        access_log off;
    }
}
