# ============================================================
# 草木有方 - Docker Compose 编排（腾讯云轻量 2G）
# 三个服务：MySQL 8 + Node API + Nginx
# 使用：docker compose up -d
# ============================================================

services:
  # ---------- MySQL 8（仅内部网络，不对外暴露）----------
  mysql:
    image: mysql:8.0
    container_name: herb-mysql
    restart: always
    # 2G 服务器内存优化参数
    command:
      - --innodb_buffer_pool_size=128M
      - --max_connections=30
      - --key_buffer_size=16M
      - --table_open_cache=200
      - --table_definition_cache=200
      - --performance_schema=OFF
      - --thread_cache_size=4
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-herb_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caomuyoufang}
      MYSQL_USER: ${MYSQL_USER:-herb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-herb_pass_2024}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动导入的 SQL（可选）：把 caomuyoufang.sql 放到 ./init-sql/ 目录
      - ./init-sql:/docker-entrypoint-initdb.d
    # 不映射宿主机端口，仅内部网络可访问（更安全）
    expose:
      - "3306"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-herb_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - herb-net

  # ---------- Node 后端 API ----------
  herb-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: herb-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caomuyoufang}
      MYSQL_USER: ${MYSQL_USER:-herb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-herb_pass_2024}
      MYSQL_CONNECTION_LIMIT: 5
      TZ: Asia/Shanghai
    volumes:
      # 持久化用户上传的图片（反馈图等，内置药材图片已在镜像内不挂载）
      - uploads_data:/app/server/uploads
    expose:
      - "8080"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>r.json()).then(d=>process.exit(d.code===0?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - herb-net

  # ---------- Nginx 反向代理（对外 80 端口）----------
  nginx:
    image: nginx:alpine
    container_name: herb-nginx
    restart: always
    depends_on:
      herb-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    networks:
      - herb-net

volumes:
  mysql_data:
  uploads_data:

networks:
  herb-net:
    driver: bridge
